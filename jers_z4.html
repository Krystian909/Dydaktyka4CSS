<table border="1" width="100%">
<tr><td>
<h2>1) <u>Zewnętrzny</u> arkusz stylów</h2>

  <head>
  <link rel="Stylesheet" type="text/css" href="style.css" /> 
  </head>

</td></tr>

<table border="1" width="100%">
<tr><td>
<h2>2) Styl <u>lokalny</u> (liniowy)</h2>
<textarea rows="5" cols="100">
Styl lokalny jest przypisywany bezpośrednio
do wybranego elementu strony internetowej.
Dotyczy tylko tego konkretnego elementu.
</textarea>
</td></tr>
</table>

<table border="1" width="100%">
<tr><td>
<h2>3) Wewnętrzny arkusz stylów</h2>
<textarea rows="5" cols="100">
Wewnętrzny arkusz stylów znajduje się
w dokumencie HTML, w sekcji head.
Pozwala określać wygląd wielu elementów
na jednej stronie internetowej.
</textarea>
</td></tr>
</table>

<table border="1" width="100%">
<tr><td>
<h2>4) Alternatywny arkusz stylów</h2>
<textarea rows="5" cols="100">
Alternatywny arkusz stylów umożliwia
przygotowanie kilku różnych wersji wyglądu
strony internetowej. Użytkownik może
wybrać jedną z dostępnych wersji.
</textarea>
</td></tr>
</table>

<table border="1" width="100%">
<tr><td>
<h2>5) Import arkusza stylów</h2>
<textarea rows="5" cols="100">
Import arkusza stylów polega na dołączeniu
zewnętrznego arkusza stylów do innego arkusza.
Dzięki temu można korzystać z ustawień
zapisanych w osobnym pliku.
</textarea>
</td></tr>
</table>
